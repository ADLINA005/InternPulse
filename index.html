<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERNPULSE</title>
    <link rel="icon" type="image/jpeg" href="bird.JPG.jpg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-image: url("vintage.JPG.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-xl-7">
                <div class="card shadow-sm p-2">
                    <div class="card-body">
                        <h1 class="h3 mb-1 fw-bold text-center text-dark">Welcome to InternPulse</h1>
                        <p class="text-dark text-center mb-4">It's time to start working on your future</p>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username / Student ID</label>
                                <input type="text" class="form-control" id="username" required placeholder="">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required placeholder="">
                            </div>
                            <button type="submit" class="btn btn-custom-green w-100 py-2 fw-bold">Log In</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('currentUser', username);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
