<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracker - Applications</title>
    <link rel="icon" type="image/jpeg" href="bird.JPG.jpg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex wrapper">

        <aside id="sidebar" class="p-3">
            <div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-briefcase-fill me-2"></i>INTERNSHIP WORKSPACE</h4>
                    <button id="sidebar-close" class="btn btn-sm" type="button" aria-label="Close menu">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>

                <div id="sidebar-collapse" class="d-flex flex-column flex-grow-1">
                    <ul class="nav nav-pills flex-column" id="sidebar-menu">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html#dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard Overview</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="application.html"><i class="bi bi-table me-2"></i>Manage Applications</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html#analytics"><i class="bi bi-pie-chart me-2"></i>Status Analytics</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html#profile"><i class="bi bi-person-circle me-2"></i>My Profile</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center justify-content-between border-top border-dark pt-3 mt-auto">
                        <span id="user-display" class="small fw-bold">Hello, ADLINA</span>
                        <button id="logout-btn" class="btn btn-outline-danger btn-sm" aria-label="Log out"><i class="bi bi-box-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </aside>

        <div id="sidebar-backdrop"></div>

        <main class="flex-grow-1 p-4 main-area">

            <div class="topbar mb-3">
                <button id="sidebar-toggle" class="btn" type="button" aria-label="Toggle menu" aria-expanded="false">
                    <i class="bi bi-list fs-5"></i><span class="ms-2">Menu</span>
                </button>
            </div>

<!--manageaplikasi-->
            <section id="section-manage" class="content-section section-box">
                <h2 class="fw-bold mb-4">Manage Internship Applications</h2>

                <div class="row g-4 mb-4">
                    <div class="col-lg-5">
                        <div class="card p-3 shadow-sm h-100">
                            <div class="card-body">
                                <h5 class="card-title text-dark mb-3"><i class="bi bi-plus-circle me-2"></i>Add Application</h5>
                                <form id="app-form">
                                    <div class="mb-3">
                                        <label for="company" class="form-label small text-dark">Company Name</label>
                                        <input type="text" class="form-control" id="company" required placeholder="e.g. Google / Maybank">
                                    </div>
                                    <div class="mb-3">
                                        <label for="role" class="form-label small text-dark">Internship Role</label>
                                        <input type="text" class="form-control" id="role" required placeholder="e.g. Software Engineering Intern">
                                    </div>
                                    <div class="mb-3">
                                        <label for="date" class="form-label small text-dark">Date Applied</label>
                                        <input type="date" class="form-control" id="date" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="status" class="form-label small text-dark">Status</label>
                                        <select class="form-select" id="status">
                                            <option value="Applied">Applied</option>
                                            <option value="Interview">Interview</option>
                                            <option value="Offered">Offered</option>
                                            <option value="Rejected">Rejected</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 fw-bold">Save Application</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-7">
                        <div class="card p-4 shadow-sm h-100">
                            <h5 class="fw-bold mb-3"><i class="bi bi-check2-square me-2 text-primary"></i>Application Checklist</h5>

                            <div class="progress checklist-progress mb-1">
                                <div id="checklist-progress-bar" class="progress-bar bg-success" style="width: 0%"></div>
                            </div>
                            <div id="checklist-progress-label" class="small text-dark mb-3"></div>

                            <ul id="checklist-items" class="list-group list-group-flush mb-3"></ul>

                            <form id="checklist-form" class="d-flex flex-column flex-sm-row gap-2">
                                <input type="text" class="form-control" id="checklist" placeholder="Add a new task..." required>
                                <button type="submit" class="btn btn-primary fw-bold text-nowrap"><i class="bi bi-plus-lg me-1"></i>Add New</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="card p-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">All Applications</h5>
                        <div class="table-responsive">
                            <table class="table table-hover text-center">
                                <thead class="table-light">
                                    <tr>
                                        <th>Company</th>
                                        <th>Role</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="full-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
